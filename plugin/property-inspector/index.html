<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>HDMI Matrix settings</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="property-inspector.js" defer></script>
	</head>
	<body>
		<main>
			<h1>HDMI Matrix</h1>
			<p class="intro">Set the address once. All Matrix buttons use this connection.</p>

			<form id="settings-form">
				<label for="matrix-url">Matrix URL</label>
				<input
					id="matrix-url"
					type="url"
					placeholder="http://matrix.local"
					autocomplete="url"
					spellcheck="false"
					required
				/>
				<p class="help">Use the address that opens the Matrix web interface.</p>
				<button type="submit">Save connection</button>
			</form>

			<p id="status" role="status" aria-live="polite"></p>
		</main>
	</body>
</html>
